name: Check Prices

on:
  schedule:
    # Beispiel: Läuft alle 2 Stunden
    - cron: '0 */2 * * *'
  workflow_dispatch: # Erlaubt das manuelle Starten via GitHub-Oberfläche

jobs:
  check-prices:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance requests pandas

      - name: Run price tracker script
        run: python stock_tracker.py
